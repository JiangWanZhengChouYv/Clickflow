<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clickflow - Mac鼠标连点器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Clickflow</h1>
      <p class="subtitle">Mac鼠标连点器</p>
    </header>

    <main class="main-content">
      <!-- 模式选择 -->
      <section class="section">
        <h2 class="section-title">模式选择</h2>
        <div class="mode-selector">
          <label class="radio-label">
            <input type="radio" name="mode" value="single" checked>
            <span class="radio-text">固定单点</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="mode" value="multi">
            <span class="radio-text">多点循环</span>
          </label>
        </div>
      </section>

      <!-- 点位配置 -->
      <section class="section">
        <h2 class="section-title">点位配置</h2>
        <div class="coordinate-input">
          <div class="input-group">
            <label for="x-input">X:</label>
            <input type="number" id="x-input" placeholder="0">
          </div>
          <div class="input-group">
            <label for="y-input">Y:</label>
            <input type="number" id="y-input" placeholder="0">
          </div>
          <button id="pick-button" class="button primary">拾取坐标</button>
        </div>
        
        <div class="point-actions">
          <button id="add-point-button" class="button secondary">添加点位</button>
          <button id="edit-point-button" class="button secondary">编辑点位</button>
          <button id="delete-point-button" class="button secondary">删除点位</button>
          <button id="clear-points-button" class="button secondary">清空点位</button>
        </div>
        
        <ul id="point-list" class="point-list">
          <!-- 点位列表将通过JavaScript动态添加 -->
        </ul>
      </section>

      <!-- 时间设置 -->
      <section class="section">
        <h2 class="section-title">时间设置</h2>
        <div class="time-settings">
          <div class="input-group">
            <label for="interval-input">间隔时间(毫秒):</label>
            <input type="number" id="interval-input" min="1" max="60000" value="100">
          </div>
          <div class="input-group">
            <label for="click-count-input">点击次数:</label>
            <input type="number" id="click-count-input" min="1" max="999999" value="100">
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="infinite-checkbox">
            <label for="infinite-checkbox">无限循环</label>
          </div>
        </div>
      </section>

      <!-- 鼠标按键 -->
      <section class="section">
        <h2 class="section-title">鼠标按键</h2>
        <div class="button-selector">
          <label class="radio-label">
            <input type="radio" name="button" value="left" checked>
            <span class="radio-text">左键</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="button" value="right">
            <span class="radio-text">右键</span>
          </label>
        </div>
      </section>

      <!-- 操作控制 -->
      <section class="section">
        <h2 class="section-title">操作控制</h2>
        <div class="control-buttons">
          <button id="start-button" class="button primary">开始</button>
          <button id="pause-button" class="button secondary" disabled>暂停</button>
          <button id="stop-button" class="button secondary" disabled>停止</button>
        </div>
      </section>

      <!-- 全局快捷键 -->
      <section class="section">
        <h2 class="section-title">全局快捷键</h2>
        <div class="hotkey-info">
          <p>开始/停止: <kbd>Cmd + Shift + S</kbd></p>
        </div>
      </section>

      <!-- 运行状态 -->
      <section class="section">
        <h2 class="section-title">运行状态</h2>
        <div id="status-indicator" class="status-indicator ready">
          <span id="status-text">就绪</span>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>&copy; 2026 Clickflow. 保留所有权利。</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
