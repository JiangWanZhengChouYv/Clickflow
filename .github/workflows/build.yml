name: Build Clickflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Swift project
        run: swift build -c release

      - name: Create .app bundle
        run: |
          APP_NAME="Clickflow"
          APP_DIR="dist/${APP_NAME}.app"
          
          mkdir -p "${APP_DIR}/Contents/MacOS"
          mkdir -p "${APP_DIR}/Contents/Resources"
          
          cp .build/release/${APP_NAME} "${APP_DIR}/Contents/MacOS/"
          
          cp Resources/Info.plist "${APP_DIR}/Contents/"
          
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable ${APP_NAME}" "${APP_DIR}/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName ${APP_NAME}" "${APP_DIR}/Contents/Info.plist"
          
          echo "✅ .app bundle created at ${APP_DIR}"

      - name: Create DMG installer
        run: |
          APP_NAME="Clickflow"
          DMG_NAME="${APP_NAME}.dmg"
          APP_DIR="dist/${APP_NAME}.app"
          DMG_PATH="dist/${DMG_NAME}"
          
          hdiutil create \
            -volname "${APP_NAME}" \
            -srcfolder "${APP_DIR}" \
            -ov \
            -format UDZO \
            "${DMG_PATH}"
          
          echo "✅ DMG created at ${DMG_PATH}"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clickflow.app
          path: dist/Clickflow.app

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clickflow.dmg
          path: dist/Clickflow.dmg
